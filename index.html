''}>${TN[k]}</option>`).join('')}</select><div class=r><input type=color value="${DB.set.col||TC[DB.set.tpl]}" onchange="DB.set.col=this.value;save();render()"><button class="bt O" style="margin:0 0 6px" onclick="DB.set.col='';save();render()">রঙ রিসেট</button></div></div></div>`};

let CSS='',DOCS;
async function snap(html,sc=3){CSS=CSS||[...document.styleSheets[0].cssRules].map(r=>r.cssText).join('').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const w=document.createElement('div');w.style.cssText='position:absolute;left:-9999px;top:0;width:794px';w.innerHTML=html;document.body.appendChild(w);const e=w.firstChild,H=Math.max(1123,e.offsetHeight),x=new XMLSerializer().serializeToString(e);w.remove();
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${794*sc}" height="${H*sc}"><g transform="scale(${sc})"><foreignObject width="794" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml"><style>${CSS}</style>${x}</div></foreignObject></g></svg>`;
const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await new Promise((a,b)=>{im.onload=a;im.onerror=b});
const c=document.createElement('canvas');c.width=794*sc;c.height=H*sc;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);return c}
const bl=(c,q=.95)=>new Promise(r=>c.toBlob(r,'image/jpeg',q)),dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()};
function slices(c){const PH=Math.round(c.width*297/210),o=[];for(let y=0;y<c.height;y+=PH){const t=document.createElement('canvas');t.width=c.width;t.height=PH;const g=t.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,t.width,PH);g.drawImage(c,0,-y);o.push(t)}return o}
function mkpdf(js){const E=new TextEncoder(),P=[],X=[];let o=0;const add=b=>{if(typeof b=='string')b=E.encode(b);P.push(b);o+=b.length};add('%PDF-1.4\n');
X[1]=o;add('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');X[2]=o;add(`2 0 obj<</Type/Pages/Kids[${js.map((_,k)=>`${3+3*k} 0 R`).join(' ')}]/Count ${js.length}>>endobj\n`);
js.forEach((j,k)=>{const p=3+3*k,c='q 595.28 0 0 841.89 0 0 cm /I Do Q';X[p]=o;add(`${p} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</I ${p+2} 0 R>>>>/Contents ${p+1} 0 R>>endobj\n`);X[p+1]=o;add(`${p+1} 0 obj<</Length ${c.length}>>stream\n${c}\nendstream endobj\n`);X[p+2]=o;add(`${p+2} 0 obj<</Type/XObject/Subtype/Image/Width ${j.w}/Height ${j.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.b.length}>>stream\n`);add(j.b);add('\nendstream endobj\n')});
const n=3+3*js.length,xo=o;add(`xref\n0 ${n}\n0000000000 65535 f \n`+X.slice(1).map(v=>String(v).padStart(10,'0')+' 00000 n \n').join('')+`trailer<</Size ${n}/Root 1 0 R>>\nstartxref\n${xo}\n%%EOF`);return new Blob(P,{type:'application/pdf'})}
async function showDoc(h,name){$('#vw').style.display='block';$('#vc').innerHTML='<div style="color:#fff;padding:50px;text-align:center">তৈরি হচ্ছে…</div>';try{const cs=[];for(const x of h)cs.push(await snap(x));DOCS={cs,name};$('#vc').innerHTML=cs.flatMap(slices).map(c=>`<img src="${c.toDataURL('image/jpeg',.7)}" style="width:100%;max-width:700px;display:block;margin:0 auto 8px;background:#fff">`).join('')}catch(e){$('#vc').innerHTML='<div style="color:#fff;padding:30px">তৈরি করা গেল না, আবার চেষ্টা করুন</div>'}}

  if(data&&data.updated_at&&data.updated_at!==lastCloudUpdatedAt){
   DB=data.data||emptyDB();normalizeDB(DB);lastCloudUpdatedAt=data.updated_at;
   localStorage.setItem('zdb',JSON.stringify(DB));render();
  }
 }catch(e){/* সাময়িক নেটওয়ার্ক সমস্যায় লোকাল ডেটা চালু থাকবে */}
}
async function activateCloudSession(session){
 const user=session&&session.user;
 if(!user){showAuth('ক্লাউড ডেটা ব্যবহার করতে অনুমোদিত Google অ্যাকাউন্ট দিয়ে লগইন করুন।');return}
 if((user.email||'').toLowerCase()!==OWNER_EMAIL){
  showAuth('এই অ্যাকাউন্ট অনুমোদিত নয়। mhiashik@gmail.com দিয়ে লগইন করুন।');
  await cloud.auth.signOut();return;
 }
 if(cloudReady&&cloudUser&&cloudUser.id===user.id)return;
 cloudUser=user;cloudReady=false;
 $('#authMessage').textContent='ক্লাউড ডেটা লোড হচ্ছে…';
 try{
  const {data,error}=await cloud.from('app_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(error)throw error;
  if(data){
   normalizeDB(data.data);lastCloudUpdatedAt=data.updated_at||null;
  }else{
   // নতুন ক্লাউড অ্যাকাউন্টে নতুন, খালি ডেটাবেস শুরু হবে।
   normalizeDB(emptyDB());lastCloudUpdatedAt=null;
   const stamp=new Date().toISOString();
   const {error:insertError}=await cloud.from('app_data').upsert({user_id:user.id,data:DB,updated_at:stamp},{onConflict:'user_id'});
   if(insertError)throw insertError;
   lastCloudUpdatedAt=stamp;
  }
  localStorage.setItem('zdb',JSON.stringify(DB));
  cloudReady=true;$('#authGate').style.display='none';$('#app').style.display='block';
  render();toast('ক্লাউড ডেটা সংযুক্ত হয়েছে');
 }catch(e){
  cloudReady=false;$('#authGate').style.display='grid';
  $('#authMessage').textContent='ক্লাউড ডেটা লোড হয়নি: '+(e.message||'সংযোগ সমস্যা')+'। আবার চেষ্টা করুন।';
 }
}
cloud.auth.onAuthStateChange((event,session)=>{setTimeout(()=>activateCloudSession(session),0)});
cloud.auth.getSession().then(({data,error})=>{
 if(error)showAuth('লগইন যাচাই করা যায়নি। আবার চেষ্টা করুন।');
 else activateCloudSession(data.session);
});
window.addEventListener('online',()=>{if(pendingCloudSave)saveCloudNow();else refreshCloud()});
window.addEventListener('focus',refreshCloud);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud()});
setInterval(refreshCloud,7000);
navigator.storage?.persist?.();
if('serviceWorker' in navigator)navigator.serviceWorker.register('Sw.js?v=cloud1',{updateViaCache:'none'}).catch(()=>0);
</script></body></html>
